<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandeep Biswal</title>
    <!-- Google Sans / Open Sans & Noto Sans Odia fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@600;700;800;900&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1b2838 0%, #0a0f18 100%);
            color: #ffffff;
            font-family: 'Google Sans', 'Open Sans', 'Noto Sans Oriya', sans-serif;
            text-align: center;
            padding: 30px 20px;
            overflow-x: hidden;
        }

        /* Ambient Glow */
        .glow-orb {
            position: fixed;
            width: 360px;
            height: 360px;
            background: linear-gradient(135deg, #ff7a18, #af002d 70%);
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.25;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .sub-badge {
            display: inline-block;
            padding: 8px 20px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            color: #ff9800;
            background: rgba(255, 152, 0, 0.1);
            border: 1px solid rgba(255, 152, 0, 0.3);
            border-radius: 50px;
            backdrop-filter: blur(8px);
        }

        /* Odia Text with safe line-height and padding to prevent cutoffs */
        .odia-heading {
            font-family: 'Google Sans', 'Noto Sans Oriya', sans-serif;
            font-size: clamp(2.8rem, 9vw, 6rem);
            font-weight: 800;
            line-height: 1.4;
            padding: 10px 15px;
            background: linear-gradient(135deg, #ffffff 40%, #ff9800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            word-break: keep-all;
            overflow-wrap: break-word;
            display: inline-block;
        }

        .title-name {
            font-size: clamp(1.4rem, 3.5vw, 2.2rem);
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #cbd5e1;
            line-height: 1.3;
        }

        .divider {
            width: 60px;
            height: 4px;
            background: #ff9800;
            border-radius: 2px;
        }

        .description {
            font-size: 1.05rem;
            color: #94a3b8;
            max-width: 520px;
            line-height: 1.6;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <div class="glow-orb"></div>

    <main class="container">
        <span class="sub-badge">Coming Soon</span>
        
        <!-- Large Odia Heading (Non-clipping) -->
        <h1 class="odia-heading">ଜଲ୍ଦି ଆସୁଅଛି</h1>
        
        <div class="divider"></div>
        
        <h2 class="title-name">Sandeep Biswal</h2>
        
        <p class="description">
            ଏକ ନୂଆ ଅନୁଭୂତି ସହ ଖୁବ୍ ଶୀଘ୍ର ଆମେ ଲାଇଭ୍ ହେବାକୁ ଯାଉଛୁ ।
        </p>
    </main>

</body>
</html>
